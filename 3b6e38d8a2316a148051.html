<script>
var SALT="vr+O6I4M/Rj7I5GWZ3A87g==", IT=310000, SELF="media/РЕЕСТР-носителей.md", KIND="page", ЖИЗНЬ=600000;
function b64d(s){s=s.trim();var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function b64e(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
function сообщи(t){var e=document.getElementById("e");if(e)e.textContent=t;}
function отметить(){try{localStorage.setItem("bt",String(Date.now()));}catch(e){}}
var ПРОСТОЙ="Сессия закрыта: "+Math.round(ЖИЗНЬ/60000)+" мин. без действий";
function протухло(){try{var t=+localStorage.getItem("bt")||0;return !t||Date.now()-t>ЖИЗНЬ;}catch(e){return true;}}
function выйти(повод){
  try{localStorage.removeItem("bk");localStorage.removeItem("bt");sessionStorage.removeItem("bm");
      if(повод)localStorage.setItem("bp",повод);}catch(e){}
  location.replace(location.pathname);
}
window.__b00m={отметить:отметить,выйти:выйти};
/* Гостевая экскурсия просит у оболочки готовый файл по имени: снимки экранов лежат
   рядом отдельными зашифрованными кусками и тянутся по мере надобности, а ключ
   живёт только здесь. Обычному сайту эта дверь не мешает — ей просто не пользуются. */
window.__b00m.достань=async function(имя){
  var к=window.__b00m.__ключ;
  if(!к)throw new Error("ключа нет");
  var б=await (await fetch(имя,{cache:"no-cache"})).arrayBuffer();
  return await расшифруй(к,new Uint8Array(б));
};
async function ключ_из(логин,пароль){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(логин+"\n"+пароль),"PBKDF2",false,["deriveBits"]);
  var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64d(SALT),iterations:IT,hash:"SHA-256"},km,256);
  return new Uint8Array(bits);
}
async function расшифруй(raw,buf){
