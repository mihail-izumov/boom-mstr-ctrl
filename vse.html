   рядом отдельными зашифрованными кусками и тянутся по мере надобности, а ключ

window.__b00m.достань=async function(имя){

  if(!к)throw new Error("ключа нет");
  var б=await (await fetch(имя,{cache:"no-cache"})).arrayBuffer();
  return await расшифруй(к,new Uint8Array(б));
};
async function ключ_из(логин,пароль){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(логин+"\n"+пароль),"PBKDF2",false,["deriveBits"]);
  var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64d(SALT),iterations:IT,hash:"SHA-256"},km,256);
  return new Uint8Array(bits);
}
async function расшифруй(raw,buf){
  var k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},k,buf.slice(12));
  if(typeof DecompressionStream==="undefined") throw new Error("старый браузер");
  var ab=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
  return new Uint8Array(ab);
}

}

async function покажи(raw){

  var данные=await расшифруй(raw,buf);

    var fr=document.createElement("iframe");fr.src=url;fr.style.cssText="border:0;width:100%;height:100vh";
